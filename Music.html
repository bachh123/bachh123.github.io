<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Music Sequencer & Synth</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/cola@1.0.0/build/cola.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            background: #1a1a1a;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-size: 0.9rem;
            color: #888;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.playing {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        input[type="range"] {
            width: 100px;
            height: 5px;
            background: #333;
            outline: none;
            border-radius: 5px;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="number"] {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 5px;
            width: 60px;
        }

        .tracks-container {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .track {
            margin-bottom: 20px;
            padding: 15px;
            background: #252525;
            border-radius: 10px;
            transition: background 0.3s;
        }

        .track:hover {
            background: #2a2a2a;
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .track-name {
            font-weight: 600;
            color: #667eea;
        }

        .track-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .step-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .step {
            aspect-ratio: 1;
            background: #333;
            border: 2px solid transparent;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .step:hover {
            transform: scale(1.05);
            border-color: #555;
        }

        .step.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }

        .step.playing {
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.8);
            transform: scale(1.1);
        }

        .effects-panel {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .effect-group {
            background: #252525;
            padding: 15px;
            border-radius: 10px;
        }

        .effect-group h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .effect-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .effect-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .volume-meter {
            width: 100%;
            height: 5px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .volume-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.1s;
        }

        @media (max-width: 768px) {
            .step-grid {
                grid-template-columns: repeat(8, 1fr);
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Interactive Music Sequencer & Synth</h1>
            <p>Create beats and melodies with this powerful web-based sequencer</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <button id="playBtn">▶ Play</button>
                <button id="stopBtn">⏹ Stop</button>
            </div>
            <div class="control-group">
                <label for="tempo">BPM:</label>
                <input type="number" id="tempo" min="60" max="200" value="120">
            </div>
            <div class="control-group">
                <label for="masterVolume">Master Volume:</label>
                <input type="range" id="masterVolume" min="0" max="100" value="70">
                <div class="volume-meter">
                    <div class="volume-bar" id="masterVolumeBar"></div>
                </div>
            </div>
        </div>

        <div class="tracks-container">
            <div class="track" data-track="0">
                <div class="track-header">
                    <span class="track-name">Kick Drum</span>
                    <div class="track-controls">
                        <label>Volume:</label>
                        <input type="range" class="track-volume" min="0" max="100" value="80">
                        <label>Sound:</label>
                        <select class="track-sound">
                            <option value="kick">Kick</option>
                            <option value="sub">Sub</option>
                            <option value="sine">Sine</option>
                        </select>
                    </div>
                </div>
                <div class="step-grid" data-steps="16"></div>
            </div>

            <div class="track" data-track="1">
                <div class="track-header">
                    <span class="track-name">Snare</span>
                    <div class="track-controls">
                        <label>Volume:</label>
                        <input type="range" class="track-volume" min="0" max="100" value="70">
                        <label>Sound:</label>
                        <select class="track-sound">
                            <option value="snare">Snare</option>
                            <option value="noise">Noise</option>
                            <option value="square">Square</option>
                        </select>
                    </div>
                </div>
                <div class="step-grid" data-steps="16"></div>
            </div>

            <div class="track" data-track="2">
                <div class="track-header">
                    <span class="track-name">Hi-Hat</span>
                    <div class="track-controls">
                        <label>Volume:</label>
                        <input type="range" class="track-volume" min="0" max="100" value="60">
                        <label>Sound:</label>
                        <select class="track-sound">
                            <option value="hihat">Hi-Hat</option>
                            <option value="noise">Noise</option>
                            <option value="sawtooth">Sawtooth</option>
                        </select>
                    </div>
                </div>
                <div class="step-grid" data-steps="16"></div>
            </div>

            <div class="track" data-track="3">
                <div class="track-header">
                    <span class="track-name">Lead Synth</span>
                    <div class="track-controls">
                        <label>Volume:</label>
                        <input type="range" class="track-volume" min="0" max="100" value="50">
                        <label>Sound:</label>
                        <select class="track-sound">
                            <option value="sine">Sine</option>
                            <option value="square">Square</option>
                            <option value="sawtooth">Sawtooth</option>
                            <option value="triangle">Triangle</option>
                        </select>
                    </div>
                </div>
                <div class="step-grid" data-steps="16"></div>
            </div>
        </div>

        <div class="effects-panel">
            <div class="effect-group">
                <h3>Reverb</h3>
                <div class="effect-controls">
                    <div class="effect-control">
                        <label>Amount:</label>
                        <input type="range" id="reverbWet" min="0" max="100" value="20">
                    </div>
                    <div class="effect-control">
                        <label>Room Size:</label>
                        <input type="range" id="reverbRoom" min="0" max="100" value="50">
                    </div>
                </div>
            </div>

            <div class="effect-group">
                <h3>Delay</h3>
                <div class="effect-controls">
                    <div class="effect-control">
                        <label>Amount:</label>
                        <input type="range" id="delayWet" min="0" max="100" value="15">
                    </div>
                    <div class="effect-control">
                        <label>Time:</label>
                        <input type="range" id="delayTime" min="0" max="100" value="30">
                    </div>
                    <div class="effect-control">
                        <label>Feedback:</label>
                        <input type="range" id="delayFeedback" min="0" max="100" value="40">
                    </div>
                </div>
            </div>

            <div class="effect-group">
                <h3>Filter</h3>
                <div class="effect-controls">
                    <div class="effect-control">
                        <label>Frequency:</label>
                        <input type="range" id="filterFreq" min="20" max="20000" value="2000">
                    </div>
                    <div class="effect-control">
                        <label>Resonance:</label>
                        <input type="range" id="filterQ" min="0" max="30" value="1" step="0.1">
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://unpkg.com/tone"></script>
    <script>
        // Initialize Tone.js
        const synths = [];
        const patterns = [[], [], [], []];
        let isPlaying = false;
        let currentStep = 0;
        let stepInterval;

        // Create audio context
        const reverb = new Tone.Reverb({
            decay: 2,
            wet: 0.2
        }).toDestination();

        const delay = new Tone.FeedbackDelay({
            delayTime: 0.3,
            feedback: 0.4,
            wet: 0.15
        }).connect(reverb);

        const filter = new Tone.Filter({
            frequency: 2000,
            Q: 1
        }).connect(delay);

        const masterGain = new Tone.Gain(0.7).connect(filter);

        // Create synths for each track
        const createSynth = (type) => {
            switch(type) {
                case 'kick':
                    return new Tone.MembraneSynth().connect(masterGain);
                case 'snare':
                    return new Tone.NoiseSynth({
                        noise: { type: 'white' },
                        envelope: { attack: 0.005, decay: 0.1, sustain: 0.1, release: 0.1 }
                    }).connect(masterGain);
                case 'hihat':
                    return new Tone.MetalSynth({
                        frequency: 200,
                        envelope: { attack: 0.001, decay: 0.05, release: 0.05 }
                    }).connect(masterGain);
                default:
                    return new Tone.Synth({
                        oscillator: { type: type }
                    }).connect(masterGain);
            }
        };

        // Initialize synths
        for (let i = 0; i < 4; i++) {
            synths.push(createSynth('sine'));
        }

        // Create step grids
        document.querySelectorAll('.track').forEach((track, trackIndex) => {
            const stepGrid = track.querySelector('.step-grid');
            for (let i = 0; i < 16; i++) {
                const step = document.createElement('div');
                step.className = 'step';
                step.dataset.step = i;
                step.dataset.track = trackIndex;
                step.addEventListener('click', toggleStep);
                stepGrid.appendChild(step);
            }
        });

        // Toggle step function
        function toggleStep(e) {
            const step = e.target;
            const trackIndex = parseInt(step.dataset.track);
            const stepIndex = parseInt(step.dataset.step);
            
            step.classList.toggle('active');
            
            if (step.classList.contains('active')) {
                patterns[trackIndex].push(stepIndex);
            } else {
                patterns[trackIndex] = patterns[trackIndex].filter(s => s !== stepIndex);
            }
        }

        // Play/Stop functionality
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        playBtn.addEventListener('click', async () => {
            if (!isPlaying) {
                await Tone.start();
                isPlaying = true;
                playBtn.textContent = '⏸ Pause';
                playBtn.classList.add('playing');
                startSequence();
            } else {
                isPlaying = false;
                playBtn.textContent = '▶ Play';
                playBtn.classList.remove('playing');
                clearInterval(stepInterval);
            }
        });

        stopBtn.addEventListener('click', () => {
            isPlaying = false;
            playBtn.textContent = '▶ Play';
            playBtn.classList.remove('playing');
            clearInterval(stepInterval);
            currentStep = 0;
            clearAllSteps();
        });

        // Start sequence
        function startSequence() {
            const tempo = parseInt(document.getElementById('tempo').value);
            const stepTime = 60000 / (tempo * 4); // 16th notes
            
            stepInterval = setInterval(() => {
                playStep(currentStep);
                updateStepDisplay(currentStep);
                currentStep = (currentStep + 1) % 16;
            }, stepTime);
        }

        // Play step
        function playStep(step) {
            patterns.forEach((pattern, trackIndex) => {
                if (pattern.includes(step)) {
                    const track = document.querySelector(`[data-track="${trackIndex}"]`);
                    const sound = track.querySelector('.track-sound').value;
                    const volume = track.querySelector('.track-volume').value / 100;
                    const synth = synths[trackIndex];
                    
                    // Update synth type if needed
                    const currentType = track.querySelector('.track-sound').value;
                    if (synth.name !== currentType) {
                        synths[trackIndex] = createSynth(currentType);
                    }
                    
                    // Play note
                    const noteMap = {
                        'kick': 'C2',
                        'snare': 'D2',
                        'hihat': 'F#2',
                        'sub': 'C1',
                        'sine': 'C4',
                        'square': 'E4',
                        'sawtooth': 'G4',
                        'triangle': 'A4',
                        'noise': 'C4'
                    };
                    
                    const note = noteMap[sound] || 'C4';
                    
                    if (sound === 'noise') {
                        synth.triggerAttackRelease('16n');
                    } else if (sound === 'kick') {
                        synth.triggerAttackRelease('C2', '8n');
                    } else if (sound === 'snare' || sound === 'hihat') {
                        synth.triggerAttackRelease('16n');
                    } else {
                        synth.triggerAttackRelease(note, '8n');
                    }
                }
            });
        }

        // Update step display
        function updateStepDisplay(step) {
            document.querySelectorAll('.step').forEach(s => {
                s.classList.remove('playing');
                if (parseInt(s.dataset.step) === step) {
                    s.classList.add('playing');
                }
            });
        }

        // Clear all playing steps
        function clearAllSteps() {
            document.querySelectorAll('.step').forEach(s => {
                s.classList.remove('playing');
            });
        }

        // Track controls
        document.querySelectorAll('.track-sound').forEach((select, index) => {
            select.addEventListener('change', (e) => {
                synths[index] = createSynth(e.target.value);
            });
        });

        document.querySelectorAll('.track-volume').forEach((slider, index) => {
            slider.addEventListener('input', (e) => {
                const volume = e.target.value / 100;
                synths[index].volume.value = Tone.gainToDb(volume);
            });
        });

        // Master controls
        document.getElementById('masterVolume').addEventListener('input', (e) => {
            const volume = e.target.value / 100;
            masterGain.gain.value = volume;
            document.getElementById('masterVolumeBar').style.width = e.target.value + '%';
        });

        document.getElementById('tempo').addEventListener('change', () => {
            if (isPlaying) {
                clearInterval(stepInterval);
                startSequence();
            }
        });

        // Effects controls
        document.getElementById('reverbWet').addEventListener('input', (e) => {
            reverb.wet.value = e.target.value / 100;
        });

        document.getElementById('reverbRoom').addEventListener('input', (e) => {
            reverb.decay = e.target.value / 100 * 5;
        });

        document.getElementById('delayWet').addEventListener('input', (e) => {
            delay.wet.value = e.target.value / 100;
        });

        document.getElementById('delayTime').addEventListener('input', (e) => {
            delay.delayTime.value = e.target.value / 100;
        });

        document.getElementById('delayFeedback').addEventListener('input', (e) => {
            delay.feedback.value = e.target.value / 100;
        });

        document.getElementById('filterFreq').addEventListener('input', (e) => {
            filter.frequency.value = e.target.value;
        });

        document.getElementById('filterQ').addEventListener('input', (e) => {
            filter.Q.value = e.target.value;
        });

        // Initialize master volume
        document.getElementById('masterVolumeBar').style.width = '70%';
    </script>
</body>
</html>
